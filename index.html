<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <h1>🌤️ Weather App</h1>
        <p class="subtitle">Cari informasi cuaca berdasarkan nama kota</p>

        <!-- Form Pencarian -->
        <form id="searchForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Masukkan nama kota..."
                autocomplete="off"
            >

            <button type="submit">
                Cari
            </button>
        </form>


        <!-- Loading -->
        <div id="loading" class="hidden">
            ⏳ Memuat data cuaca...
        </div>


        <!-- Error -->
        <div id="error" class="hidden"></div>


        <!-- Hasil Cuaca -->
        <section id="weatherResult" class="hidden">

    <h2 id="cityName"></h2>

    <img
        id="weatherIcon"
        src=""
        alt="Ikon cuaca"
    >

    <p id="temperature" class="temperature"></p>

    <p id="feelsLike"></p>

    <p id="description"></p>

    <p id="humidity"></p>

    <p id="windSpeed"></p>
    
    <div class="unit-toggle">
    <button id="celsiusBtn" type="button">°C</button>
    <button id="fahrenheitBtn" type="button">°F</button>
</div>

</section>

<section id="forecastSection" class="forecast-section hidden">
    <h3>Prakiraan 5 Hari</h3>

    <div id="forecastList" class="forecast-list"></div>
</section>

<section class="history-section">
    <div class="history-header">
        <h3>Riwayat Pencarian</h3>

        <button id="clearHistoryBtn" type="button">
            Hapus Riwayat
        </button>
    </div>

    <div id="searchHistory"></div>
</section>

    </main>
    
<script src="app.js"></script>

</body>
</html>
