<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <header class="app-header">
            <div class="app-logo">🌿</div>

            <div>
                <h1>Weather App</h1>
                <p>Cek cuaca kota dengan mudah</p>
            </div>
        </header>

        <form id="searchForm" class="search-form">
            <input
                type="text"
                id="cityInput"
                placeholder="Masukkan nama kota..."
                autocomplete="off"
            >

            <button type="submit">
                Cari
            </button>
        </form>

        <div id="loading" class="loading hidden">
            ⏳ Memuat data cuaca...
        </div>

        <div id="error" class="error hidden"></div>


        <!-- CUACA SEKARANG -->
        <section id="weatherResult" class="weather-result hidden">

            <p class="section-label">Cuaca Sekarang</p>

            <h2 id="cityName"></h2>

            <img
                id="weatherIcon"
                src=""
                alt="Ikon cuaca"
            >

            <p id="temperature" class="temperature"></p>

            <p id="feelsLike" class="feels-like"></p>

            <p id="description" class="description"></p>

            <div class="weather-info">

                <div class="info-card">
                    <span>💧</span>

                    <div>
                        <small>Kelembaban</small>
                        <p id="humidity"></p>
                    </div>
                </div>

                <div class="info-card">
                    <span>🌬️</span>

                    <div>
                        <small>Kecepatan Angin</small>
                        <p id="windSpeed"></p>
                    </div>
                </div>

            </div>

            <div class="unit-toggle">

                <button
                    id="celsiusBtn"
                    class="active"
                    type="button"
                >
                    °C
                </button>

                <button
                    id="fahrenheitBtn"
                    type="button"
                >
                    °F
                </button>

            </div>

        </section>


        <!-- FORECAST -->
        <section
            id="forecastSection"
            class="forecast-section hidden"
        >

            <div class="section-title">
                <h3>Perkiraan 5 Hari</h3>
                <span>🌤️</span>
            </div>

            <div
                id="forecastList"
                class="forecast-list"
            ></div>

        </section>


        <!-- RIWAYAT -->
        <section class="history-section">

            <div class="history-header">

                <h3>Riwayat Pencarian</h3>

                <button
                    id="clearHistoryBtn"
                    type="button"
                >
                    Hapus Riwayat
                </button>

            </div>

            <div id="searchHistory"></div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
